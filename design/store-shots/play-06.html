<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="play.css">
<style>
  :root {
    --type-top: 200px; --headline-size: 126px;
    --scrim-top: 170px; --scrim-h: 700px;
  }
  .slice { position: absolute; left: 0; right: 0; overflow: hidden; z-index: 1; }
  .slice img { position: absolute; left: 0; width: 1080px; height: auto; }
  .slice-photo { top: 640px; height: 660px; }
  .slice-photo img { top: -560px; }
  .slice-deck { top: 1220px; height: 440px; }
  .slice-deck img { top: -1690px; }
  .gmark-corner { bottom: 45px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="slice slice-photo">
    <img src="raw/07-featured.png" alt="">
    <div class="plate" style="left:206px; top:528px; width:82px; height:37px;"></div>
  </div>
  <div class="slice slice-deck"><img src="raw/07-featured.png" alt=""></div>

  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">Featured</span><span class="hair"></span></div>
    <div class="headline">Your build,<br><span class="warm">on a cover.</span></div>
    <div class="deck">A magazine cover, written from your own photos and specs.</div>
  </div>

  <div class="numeral" style="z-index:5">06</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
