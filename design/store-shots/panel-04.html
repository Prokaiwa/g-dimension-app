<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* "It writes itself" was too clever to parse; the deck states the mechanism.
     line-height is raised on this headline only: at 0.90 the comma in
     "Your build," collided with the D of "chronicled" on the line below. */
  :root {
    --wedge-h: 1120px; --wedge-rise: 68%;
    --type-top: 210px; --headline-size: 150px;
    --dev-top: 1260px; --dev-w: 900px; --dev-left: 195px;
    --dev-crop: 129px; --dev-h: 1440px;
  }
  .wedge-type .headline { line-height: 1.02; }
</style>
</head>
<body>
<div class="canvas">
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="wedge-type">
    <div class="rule-row"><span class="kicker">The Timeline</span><span class="hair"></span></div>
    <div class="headline">Your build,<br><span class="warm">chronicled.</span></div>
    <div class="deck voice">Every mod and service lands here on its own, in the order it happened.</div>
  </div>

  <div class="device">
    <img src="raw/04-timeline.png" alt="">
    <div class="plate" style="left:55px; top:374px; width:112px; height:78px;"></div>
  </div>
  <div class="numeral">04</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
