<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* line-height raised on this headline only: at 0.90 the comma in
     "Your build," collided with the D of "chronicled" below it. */
  :root {
    --shift: 0px;
    --type-top: 350px; --headline-size: 150px;
    /* Scrim starts at 0, not below the wedge. The wedge's right edge is at
       37% of its height, so between that edge and the old scrim top a sliver
       of bare parchment showed through as a bright wedge of white. The scrim
       sits UNDER the wedge (z-index 1), so starting it at 0 costs nothing. */
    --scrim-top: 0px; --scrim-h: 1420px;
  }
  .type-over .headline { line-height: 1.02; }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/pub-timeline.png" alt="">
  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">The Timeline</span><span class="hair"></span></div>
    <div class="headline">Your build,<br><span class="warm">chronicled.</span></div>
    <div class="deck">Every mod, service, track day and show, in the order it happened.</div>
  </div>

  <div class="numeral" style="z-index:5">04</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
