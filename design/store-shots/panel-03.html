<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* Shift puts the dated rows AND the services / total footer below the type,
     so the money is visible without captioning it. */
  :root {
    --shift: -250px;
    /* Shallower than its neighbours on purpose: the Maintenance screen has a
       strong orange diagonal of its own, and a deep burgundy cut on top of it
       made two diagonals fight for the same corner. */
    --wedge-h: 520px; --wedge-rise: 46%;
    --type-top: 320px; --headline-size: 150px;
    --scrim-top: 260px; --scrim-h: 1120px;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/06b-service.png" alt="">
  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">Service History</span><span class="hair"></span></div>
    <div class="headline">Every service,<br><span class="warm">logged.</span></div>
    <div class="deck">Date, mileage, cost, and the shop. On every oil change and every repair.</div>
  </div>

  <div class="numeral" style="z-index:5">03</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
