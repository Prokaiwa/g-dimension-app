<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* Closes the set on the Home map.
     The art here is a REAL DEVICE screenshot, not a headless capture. The map
     carries a fractal-noise texture that WebKit resolves into smooth tone and
     Blink resolves into per-pixel speckle, so every Chromium capture came out
     visibly grainy. Supersampling could not help (the grain is a fixed 240px
     CSS tile, so it scales with the capture), median and blur could not remove
     it, and stripping the noise layer exposed the tiled seams underneath that
     it exists to hide. A device screenshot sidesteps all of it.
     The iOS status bar and the app header are cropped off in
     scripts (see raw/01-home-device.png), so the art starts at the map. */
  :root {
    --type-top: 285px; --headline-size: 150px;
    --scrim-top: 250px; --scrim-h: 900px;
  }
  .art-device {
    position: absolute; left: 0; top: 900px; width: 1290px; height: auto; z-index: 1;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="art-device" src="raw/01-home-device.png" alt="">

  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">Everything</span><span class="hair"></span></div>
    <div class="headline">One car.<br><span class="warm">One record.</span></div>
    <div class="deck">Garage, tuning, service, timeline and cover. Share all of it with one link.</div>
  </div>

  <div class="numeral" style="z-index:5">07</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
