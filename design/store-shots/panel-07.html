<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* Closes on the PUBLIC profile, not the private Home map.
     The old version showed Home and claimed you share "garage, tuning, service,
     timeline and cover" — but service is never public. The public profile shows
     exactly the four destinations a visitor actually gets, so the picture and
     the claim now agree without anyone having to take the copy on trust. */
  :root {
    /* The map's own span from the Garage node to the Featured label is ~1800px
       and the canvas has almost exactly that below the type, so the shift and
       the type block are tuned against each other: raise the type, shorten the
       deck to two lines, and all four nodes fit without the last one falling
       off the bottom edge. */
    --shift: 310px;
    --type-top: 240px; --headline-size: 150px;
    --scrim-top: 0px; --scrim-h: 1180px;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/pub-profile.png" alt="">
  <!-- The shift carries the app header ("Leave", avatar, "Visiting @…") down
       past the wedge's right edge, where it would show as a bright bar. It also
       carried a real face onto a store listing. -->
  <div class="mask" style="left:0; right:0; top:222px; height:290px; z-index:1;"></div>

  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">Community</span><span class="hair"></span></div>
    <div class="headline">Your car.<br><span class="warm">Your world.</span></div>
    <div class="deck">A page of your own, where other enthusiasts can find the work.</div>
  </div>

  <div class="numeral" style="z-index:5">07</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
