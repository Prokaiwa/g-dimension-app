<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* The cover fills the canvas and is already designed, so this panel keeps the
     smallest wedge in the run and sets its one line in the cover's own dead
     band between photo and headline. */
  :root {
    /* Nudged UP, not down. Pushing the cover down put its cream masthead below
       the wedge's right-hand edge, where it poked out as a bright band. At -40
       the masthead sits entirely under the wedge and the black gap above the
       photo is free for the explanatory line. */
    --shift: -40px;
    --type-top: 285px; --headline-size: 92px;
    --deck-top: 470px;
  }
  /* One line only, and smaller: the gap between the headline and the top of the
     cover photo is ~110px and a two-line deck ran straight through it. */
  .deck-float { font-size: 40px; }
  /* This panel's bottom-right corner is already occupied by the cover's own
     INSIDE button and barcode, so the brand mark moves up out of them. */
  .gmark-corner { bottom: 300px; }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/07-featured.png" alt="">
  <div class="plate" style="left:246px; top:1260px; width:98px; height:44px; z-index:3;"></div>

  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type" style="z-index:4">
    <div class="rule-row"><span class="kicker" style="color:#f0e4c8">Featured</span><span class="hair"></span></div>
    <div class="headline">Your build, <span class="warm">on a cover.</span></div>
  </div>

  <div class="deck-float" style="z-index:4">A magazine cover, written from your own photos and specs.</div>
  <div class="numeral" style="z-index:5">06</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
