<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* Featured is built from TWO SLICES of the cover rather than the whole thing.
     The cover is a full-height design: masthead, photo, a deliberate ~460px of
     dead band, then its own headline block. At full bleed that band opened a
     hole between the car and the feature deck, and there was no room left for
     type at the same size as the rest of the set — so this panel used a smaller
     headline and deck, which made it the odd one out.
     Slicing the band out solves both: the photo and the cover's headline block
     sit together, and the type above them matches every other panel. */
  :root {
    --type-top: 285px; --headline-size: 150px;
    --scrim-top: 250px; --scrim-h: 900px;
  }
  .slice { position: absolute; left: 0; right: 0; overflow: hidden; z-index: 1; }
  .slice img { position: absolute; left: 0; width: 1290px; height: auto; }

  /* The cover photo. */
  .slice-photo { top: 830px; height: 995px; }
  .slice-photo img { top: -630px; }

  /* The cover's own headline block + barcode, butted straight up against it. */
  .slice-deck { top: 1825px; height: 806px; }
  .slice-deck img { top: -1990px; }

  /* The cover's bottom-right corner carries its own INSIDE button and barcode,
     so the brand mark drops below them. */
  .gmark-corner { bottom: 34px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="slice slice-photo">
    <img src="raw/07-featured.png" alt="">
    <div class="plate" style="left:246px; top:670px; width:98px; height:44px;"></div>
  </div>
  <div class="slice slice-deck"><img src="raw/07-featured.png" alt=""></div>

  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">Featured</span><span class="hair"></span></div>
    <div class="headline">Your build,<br><span class="warm">on a cover.</span></div>
    <div class="deck">A magazine cover, written from your own photos and specs.</div>
  </div>

  <div class="numeral" style="z-index:5">06</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
