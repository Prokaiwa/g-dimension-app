<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ── App Store 6.9" canvas. Exact export pixels, no scaling at capture. ──
     Tokens mirrored from src/tokens/index.ts:
       COLOR_ACCENT #c8661a · COLOR_BRAND #780E12 · COLOR_CAVITY_BG #050507
       COLOR_TEXT_PRIMARY #f5f5f5 (never pure white in body)
     Type: FONT_MASTHEAD Anton + FONT_DECK Oswald, borrowed from the Featured
     magazine island because store screenshots are the same register. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #17181a; }

  .canvas {
    position: relative;
    width: 1290px;
    height: 2796px;
    overflow: hidden;
    background: #050507;
  }

  /* ── The app screen, full-bleed at native 1:1. No crop, no upscale: the
        capture is already exactly the canvas. Keeping the real header is
        deliberate — it is the one signal in an otherwise poster-like panel
        that this is a running app, and the type sits in the garage stage's
        own darkness below it. ── */
  .art {
    position: absolute;
    inset: 0;
    width: 1290px;
    height: 2796px;
  }

  /* Scrim: guarantees headline legibility over the stage without flattening
     the garage's own falloff. Dies out well above the car's roofline, and
     starts BELOW the app header so the real chrome stays crisp and unclouded. */
  .scrim {
    position: absolute; left: 0; right: 0; top: 200px; height: 1500px;
    background: linear-gradient(180deg,
      rgba(5,5,7,0.0) 0%,
      rgba(5,5,7,0.86) 12%,
      rgba(5,5,7,0.88) 46%,
      rgba(5,5,7,0.40) 74%,
      transparent 100%);
  }

  /* The burgundy wedge seed. Panel 01 is nearly all black on purpose; the
     wedge enters properly at panel 03 and peaks around 05-06. This is just
     the first hint of it, high on the left edge where it meets only the scrim.
     It must never sit OVER the app UI — on the first pass it was low-left and
     tinted the CHOOSE keys red, which read as a colour-management bug. */
  .wedge-seed {
    position: absolute; left: -720px; top: 100px;
    width: 1340px; height: 1560px;
    background: radial-gradient(ellipse at center, rgba(120,14,18,0.62) 0%, rgba(120,14,18,0.16) 48%, transparent 72%);
  }

  /* ── Type block ── */
  .type { position: absolute; left: 96px; right: 96px; top: 430px; }

  /* Magazine device: kicker, hairline, page numeral on one baseline. */
  .rule-row { display: flex; align-items: center; gap: 28px; }
  .kicker {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 30px; letter-spacing: 0.34em; text-transform: uppercase;
    color: #c8661a; white-space: nowrap;
  }
  .hair { flex: 1; height: 1px; background: rgba(245,245,245,0.22); }
  .numeral {
    font-family: 'Oswald', sans-serif; font-weight: 400;
    font-size: 28px; letter-spacing: 0.18em;
    color: rgba(245,245,245,0.42);
  }

  .headline {
    margin-top: 58px;
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 172px; line-height: 0.90; letter-spacing: -0.005em;
    text-transform: uppercase; color: #f5f5f5;
  }
  /* Second line drops to the accent — the promise lands on the brand color. */
  .headline .warm { color: #c8661a; }

  .deck {
    margin-top: 46px;
    font-family: 'Oswald', sans-serif; font-weight: 300;
    font-size: 50px; line-height: 1.32; letter-spacing: 0.005em;
    color: rgba(245,245,245,0.60);
    max-width: 900px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="art" src="raw/pub-garage.png" alt="">
    <div class="scrim"></div>
    <div class="wedge-seed"></div>

    <div class="type">
      <div class="rule-row">
        <span class="kicker">The Garage</span>
        <span class="hair"></span>
        <span class="numeral">01</span>
      </div>
      <div class="headline">Your build<br><span class="warm">has a story.</span></div>
      <div class="deck">Every car you have owned, in one permanent place.</div>
    </div>
  </div>
</body>
</html>
