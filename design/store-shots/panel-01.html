<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  :root {
    --shift: -150px;
    --type-top: 330px; --headline-size: 158px;
    --scrim-top: 240px; --scrim-h: 1150px;
    --footer-top: 2268px;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/pub-garage.png" alt="">
  <div class="plate" style="left:176px; top:calc(1756px + var(--shift)); width:146px; height:56px; z-index:3;"></div>
  <div class="footer" style="z-index:3"></div><div class="footer-rule" style="z-index:3"></div>
  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">The Garage</span><span class="hair"></span></div>
    <div class="headline">Your build<br><span class="warm">has a story.</span></div>
    <div class="deck">Every car you have owned, logged in one place that does not forget.</div>
  </div>

  <div class="footer-line" style="z-index:4">
    <span>Modifications</span><span class="dot"></span>
    <span>Service</span><span class="dot"></span>
    <span>Timeline</span>
  </div>
  <div class="numeral" style="z-index:5">01</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
