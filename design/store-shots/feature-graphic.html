<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:ital,wght@0,700;1,700;1,800&display=swap" rel="stylesheet">
<style>
  /* Play Store feature graphic — 1024 × 500, and required. The most-seen asset
     on a Play listing and the one people forget.

     LAYOUT NOTE. The first version filled the left 62% with burgundy and put the
     lockup on it. Two things were wrong with that:

       1. Every shield asset in this repo draws the shield in BURGUNDY, so on a
          burgundy field it vanished. Patching that with the app-icon tile made
          it worse: an app icon is a PRODUCT asset that carries its own container
          (rounded square, own background) because it has to sit on a home
          screen. Dropping that container into a marketing composition reads as a
          sticker pasted on.
       2. A burgundy half-field is a lot of flat colour on an asset this small,
          and it boxed the car into the remaining third.

     So the burgundy is now a narrow SPINE down the left edge — the panels' angled
     cut rotated into the vertical — and the field is the brand's actual home,
     near-black. That gives the bare shield the contrast it needs with no new
     assets, and lets the car run across the width.

     HIERARCHY is the classic ad structure: hook, payoff, signature.
       headline    — the emotional hook, the same line as panel 01
       catchphrase — the site's own three-beat line, small and tracked
       lockup      — the brand signing off, muted, at the foot
     Play shows the app icon and name beside this graphic in most placements, so
     it does not need to shout the name. It needs to sell.

     Play re-crops this asset for different placements, so everything that
     matters sits well inside the middle and the art fades at every edge. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #17181a; }

  .canvas {
    position: relative; width: 1024px; height: 500px;
    overflow: hidden;
    background: radial-gradient(ellipse 70% 120% at 32% 45%, #16171a 0%, #050507 72%);
    font-synthesis-weight: none;
  }

  /* ── The car ─────────────────────────────────────────────────────────────
     Pre-cropped off the garage stage (raw/car-crop.png) with plenty of dark
     around it, so its own edges dissolve instead of ending on a box. */
  .car { position: absolute; left: 480px; top: -30px; width: 820px; height: auto; z-index: 1; }
  .car-plate {
    position: absolute; left: 587px; top: 356px; width: 78px; height: 46px; z-index: 2;
    backdrop-filter: blur(7px) saturate(0.45) contrast(0.88);
    -webkit-backdrop-filter: blur(7px) saturate(0.45) contrast(0.88);
    -webkit-mask-image: radial-gradient(ellipse 64% 64% at center, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 64% 64% at center, #000 55%, transparent 100%);
  }
  .car-fade {
    position: absolute; inset: 0; z-index: 2;
    background:
      /* Deep enough that the car ghosts away behind the type column rather than
         running its grille through the catchphrase. */
      linear-gradient(90deg, #050507 46%, rgba(5,5,7,0.72) 56%, rgba(5,5,7,0) 72%),
      linear-gradient(0deg, #050507 0%, rgba(5,5,7,0) 20%),
      linear-gradient(180deg, #050507 0%, rgba(5,5,7,0) 16%),
      linear-gradient(270deg, #050507 0%, rgba(5,5,7,0) 10%);
  }

  /* ── The wedge ───────────────────────────────────────────────────────────
     A corner wedge rather than a full-height spine: it meets the left edge
     halfway down and runs two thirds of the way along the top, so the cut is a
     single long diagonal across the top-left. That is much closer to the phone
     panels, where the burgundy is a top band with an angled lower edge, and it
     leaves the bottom-left of the canvas clear for the signature.

     The headline is positioned to STRADDLE this cut, the same move the panels
     make: the first line starts on burgundy and crosses onto the dark field.
     White holds up on both, which is why the emphasis line (amber) is the one
     that sits fully on the dark. */
  .wedge {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 3;
    background: linear-gradient(145deg, #780E12 0%, #5c0c10 58%, #3a0709 100%);
    clip-path: polygon(0 0, 66.7% 0, 0 50%);
  }
  /* The amber hairline the panels put on their cut. */
  .wedge-edge {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 4;
    clip-path: polygon(0 50%, 66.7% 0, 67.5% 0, 0 calc(50% + 4px));
    background: rgba(200,102,26,0.55);
  }

  /* ── Type ────────────────────────────────────────────────────────────────── */
  .type { position: absolute; left: 208px; top: 112px; z-index: 5; width: 470px; }

  .headline {
    font-family: 'Anton', sans-serif; font-size: 76px; line-height: 0.92;
    text-transform: uppercase; color: #f5f5f5; letter-spacing: -0.005em;
  }
  .headline .warm { color: #c8661a; }

  .catchphrase {
    margin-top: 26px;
    font-family: 'Oswald', sans-serif; font-weight: 400; font-size: 24px;
    letter-spacing: 0.20em; text-transform: uppercase;
    color: rgba(240,228,200,0.72);
  }

  /* The signature. Bare shield on the dark field, where it actually reads, with
     the wordmark at its canonical Hanken italic and -0.085em tracking. */
  .lockup { margin-top: 40px; display: flex; align-items: center; gap: 15px; }
  .lockup img { height: 44px; width: auto; display: block; }
  .lockup span {
    font-family: 'Hanken Grotesk', sans-serif; font-style: italic; font-weight: 700;
    font-size: 32px; letter-spacing: -0.085em; color: rgba(245,245,245,0.92);
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="car" src="raw/car-crop.png" alt="">
  <div class="car-plate"></div>
  <div class="car-fade"></div>

  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type">
    <div class="headline">Your build<br><span class="warm">has a story.</span></div>
    <div class="catchphrase">Build it. &nbsp;Log it. &nbsp;Own it.</div>
    <div class="lockup">
      <img src="raw/g-shield.png" alt="">
      <span>G-Dimension</span>
    </div>
  </div>
</div>
</body>
</html>
