<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:ital,wght@0,700;1,700;1,800&display=swap" rel="stylesheet">
<style>
  /* Play Store feature graphic — 1024 × 500, and required.
     It is the most-seen asset on a Play listing and the one people forget.
     Deliberately NOT a phone screenshot: at 500px tall a portrait screen would
     be a postage stamp, and Play crops this asset for different placements, so
     everything that matters stays well inside the middle.
     Same language as the panels — burgundy wedge cut on the diagonal, Anton
     masthead, one amber line, the car on the dark side. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #17181a; }

  .canvas {
    position: relative; width: 1024px; height: 500px;
    overflow: hidden; background: #050507;
    font-synthesis-weight: none;
  }

  /* The car, pre-cropped off the garage stage (raw/car-crop.png) so no info
     strip or header comes with it. Positioned by left/top rather than
     right/bottom so the plate blur below can be placed deterministically. */
  .car {
    position: absolute; left: 440px; top: -40px;
    width: 820px; height: auto; z-index: 1;
  }
  /* The licence plate, blurred as on every panel. */
  .car-plate {
    position: absolute; left: 548px; top: 347px; width: 78px; height: 48px; z-index: 2;
    backdrop-filter: blur(7px) saturate(0.45) contrast(0.88);
    -webkit-backdrop-filter: blur(7px) saturate(0.45) contrast(0.88);
    -webkit-mask-image: radial-gradient(ellipse 64% 64% at center, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 64% 64% at center, #000 55%, transparent 100%);
  }
  /* Falloff so the crop's edges dissolve into the field instead of ending on a
     visible seam. Play crops this asset for different placements, so the art
     has to survive losing its edges. */
  .car-fade {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(90deg, #050507 30%, rgba(5,5,7,0.6) 40%, rgba(5,5,7,0) 52%),
      linear-gradient(0deg, #050507 0%, rgba(5,5,7,0) 16%),
      linear-gradient(180deg, #050507 0%, rgba(5,5,7,0) 14%);
  }

  /* The wedge, angled the same way as every panel. */
  .wedge {
    position: absolute; left: 0; top: 0; width: 640px; height: 500px; z-index: 3;
    background: linear-gradient(160deg, #780E12 0%, #4a0a0c 78%, #3a0709 100%);
    clip-path: polygon(0 0, 100% 0, 62% 100%, 0 100%);
  }
  .wedge-edge {
    position: absolute; left: 0; top: 0; width: 644px; height: 500px; z-index: 4;
    clip-path: polygon(100% 0, calc(100% + 3px) 0, calc(62% + 3px) 100%, 62% 100%);
    background: rgba(200,102,26,0.55);
  }

  .type { position: absolute; left: 64px; top: 116px; z-index: 5; width: 520px; }
  .mark { display: flex; align-items: center; gap: 18px; }
  /* The app icon tile, not the bare badge. Every shield asset in the repo is
     burgundy, so on the burgundy wedge the shield vanished and only the white G
     was left floating. The icon already ships the shield on its own near-black
     field, which is exactly the contrast this needs — and it is literally the
     mark people will tap on their home screen. */
  .mark img {
    height: 74px; width: 74px; display: block;
    border-radius: 17px;
  }
  /* Canonical wordmark styling, matching StartSplash and the trading cards:
     Hanken Grotesk italic 700 at -0.085em. The tight tracking is the whole
     character of it. */
  .mark span {
    font-family: 'Hanken Grotesk', sans-serif; font-style: italic; font-weight: 700;
    font-size: 42px; letter-spacing: -0.085em; color: #f5f5f5;
  }
  .headline {
    margin-top: 34px;
    font-family: 'Anton', sans-serif; font-size: 74px; line-height: 0.92;
    text-transform: uppercase; color: #f5f5f5; letter-spacing: -0.005em;
  }
  .headline .warm { color: #c8661a; }
  /* The site's own catchphrase (public/marketing.html), set with the spacing a
     three-beat line wants. */
  .deck {
    margin-top: 22px;
    font-family: 'Oswald', sans-serif; font-weight: 400; font-size: 27px;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: rgba(240,228,200,0.82);
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="car" src="raw/car-crop.png" alt="">
  <div class="car-plate"></div>
  <div class="car-fade"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type">
    <div class="mark">
      <img src="../../public/icon-512.png" alt="">
      <span>G-Dimension</span>
    </div>
    <div class="headline">Your build<br><span class="warm">has a story.</span></div>
    <div class="deck">Build it. &nbsp;Log it. &nbsp;Own it.</div>
  </div>
</div>
</body>
</html>
