<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* --shift slides the summary card up behind the type so the CHASSIS group,
     the wheels and the coilovers all land below it at full size. */
  :root {
    --shift: -250px;
    --type-top: 340px; --headline-size: 150px;
    --scrim-top: 250px; --scrim-h: 1120px;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="raw/pub-buildsheet.png" alt="">
  <div class="type-scrim"></div>
  <div class="wedge"></div><div class="wedge-edge"></div>

  <div class="type-over">
    <div class="rule-row"><span class="kicker">The Build Sheet</span><span class="hair"></span></div>
    <div class="headline">Show the<br><span class="warm">whole build.</span></div>
    <div class="deck">Specs, receipts, and the DIY steps behind every part on your car.</div>
  </div>

  <div class="numeral" style="z-index:5">02</div>
  <img class="gmark-corner" src="../../src/assets/logo/gdimensionG.webp" alt="">
</div>
</body>
</html>
