<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#e8eaec"/><stop offset="0.45" stop-color="#b9bec3"/>
      <stop offset="0.75" stop-color="#8f959b"/><stop offset="1" stop-color="#6d7278"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f33"/><stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="hose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f65"/><stop offset="1" stop-color="#34383d"/>
    </linearGradient>
  </defs>
  <!-- hose looping to the right -->
  <path d="M92 58 q26 6 24 30 q-2 22 -18 26" fill="none" stroke="url(#hose)" stroke-width="7" stroke-linecap="round"/>
  <!-- nozzle -->
  <path d="M96 112 l16 -4 a5 5 0 0 1 5 6 l-3 10 a5 5 0 0 1 -7 3 l-13 -6 z" fill="#7d8288"/>
  <!-- pump body -->
  <rect x="24" y="18" width="68" height="112" rx="9" fill="url(#body)"/>
  <!-- shoulder highlight -->
  <rect x="30" y="22" width="20" height="102" rx="6" fill="#ffffff" opacity="0.16"/>
  <!-- display -->
  <rect x="34" y="30" width="48" height="34" rx="4" fill="url(#screen)"/>
  <rect x="38" y="36" width="26" height="5" rx="2" fill="#9aa1a8" opacity="0.75"/>
  <rect x="38" y="46" width="34" height="7" rx="2" fill="#c8661a" opacity="0.9" class="readout"/>
  <!-- grille lines -->
  <rect x="34" y="76" width="48" height="3" rx="1.5" fill="#6f757b" opacity="0.55"/>
  <rect x="34" y="86" width="48" height="3" rx="1.5" fill="#6f757b" opacity="0.55"/>
  <rect x="34" y="96" width="34" height="3" rx="1.5" fill="#6f757b" opacity="0.45"/>
  <!-- base -->
  <rect x="18" y="128" width="80" height="12" rx="4" fill="#5f656b"/>
  <rect x="18" y="128" width="80" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
</svg>
