<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* MOCKUP ONLY. Composites a proposed roadside fuel stop onto a real Home-map
     screenshot so placement and weight can be judged before any code is written.
     The pump is the owner's own rendered node, background-cut by cutout.mjs. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#050507; }
  .canvas { position:relative; width:1170px; height:2317px; overflow:hidden; }
  /* Shifted up 60px to drop the sliver of the app header left by the crop of the
     source screenshot. The 60px this opens at the bottom is already black. */
  .map { position:absolute; left:0; top:-60px; width:1170px; height:2317px; }

  /* SIZE. Held to the destinations, not below them. The first pass ran it at
     about 70% of a node on the theory that scenery should be smaller than a
     place you go, and it just read as a mistake: a toy dropped between two
     full-size objects. The oil bottle measures 214px tall here and the magazine
     234px, so the pump takes 222px and its own aspect (730x1250 after the
     cutout) sets the width. What separates a stop from a destination is the
     LABEL, not the scale: small, dim, and not in the destinations' caps.

     PLACEMENT. Inside the loop, in the open pocket between HOME and TIMELINE,
     and deliberately OFF the road.

     It used to sit on the bottom road between Featured and Maintenance. That is
     the narratively obvious spot and it was a hit-target trap: at world scale the
     pump left only about 27pt of clear space to the magazine on one side and the
     oil bottle on the other, and a node's tap area is always larger than its art.
     Three targets that close on a map navigated by thumb means mis-taps into a
     whole section.

     The pocket here measures roughly 244 x 360 and holds nothing but faint grid.
     Clearances at these coordinates: 90px down from the HOME caption, 24px right
     of the Timeline wrench, and about 170px clear of the Home-to-Timeline road,
     which also keeps it off the "To Timeline" script.

     Being off the road is not a compromise. A station set back from the highway
     is how they actually sit, and it draws the line this needs: the five nodes
     are places on the route, and this is a thing you pull over for. */
  .stop { position:absolute; left:410px; top:913px; width:130px; z-index:3; }
  .stop img { display:block; width:130px; height:auto; }

  /* The 25deg cast shadow the Garage world uses, so the object sits on the
     ground plane like every other node. */
  .stop::after {
    content:''; position:absolute; left:14px; bottom:-10px; width:104px; height:20px;
    background:#000; opacity:0.36; filter:blur(7px); border-radius:50%;
  }

  /* Two thirds the size of a destination caption and dimmer. This is what says
     "you pull over here" while the object itself keeps the world's scale. */
  .stop-label {
    position:absolute; left:383px; top:1206px; width:184px; text-align:center; z-index:3;
    font-family:'Hanken Grotesk',sans-serif; font-weight:700; font-size:27px;
    letter-spacing:0.16em; color:rgba(228,232,236,0.55);
  }

  /* Stale state: the readout warms to the brand amber and the sign picks up a
     soft halo. Same idea as a low-fuel light, but it belongs to the world
     instead of being HUD chrome laid over it. */
  .stale .stop::before {
    content:''; position:absolute; left:-26px; top:-14px; right:-26px; bottom:-14px;
    background:radial-gradient(ellipse at center, rgba(200,102,26,0.34) 0%, rgba(200,102,26,0) 68%);
  }
  .stale .stop-label { color:rgba(200,102,26,0.92); }
</style></head>
<body>
<div class="canvas">
  <img class="map" src="home-map.png" alt="">
  <div class="stop"><img src="pump-node.png" alt=""></div>
  <div class="stop-label">FUEL</div>
</div>
</body></html>
