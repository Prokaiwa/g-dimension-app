<!doctype html>
<!--
  YouTube relay for the native app (ADR-041). YouTube's embedded player needs an
  HTTP Referer, and the app's pages are served from capacitor://localhost, which
  sends none, so a direct embed shows "Video player configuration error". The app
  frames this page instead; its request to YouTube carries gdimension.app as the
  referrer. vercel.json gives this one file its own headers so only the app's
  origins may frame it. No inline script: yt.js is loaded under script-src 'self'.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<script src="/yt.js"></script>
</body>
</html>
